name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test fitting library
        run: dotnet test tests/MeshFit.Core.Tests -c Release
      - name: Build SOLIDWORKS add-in
        run: dotnet build src/MeshFit.SolidWorks -c Release
      - name: Upload add-in
        uses: actions/upload-artifact@v4
        with:
          name: MeshFit-SolidWorks-addin
          path: src/MeshFit.SolidWorks/bin/Release/net48/
