name: release

# Builds the SOLIDWORKS add-in on Windows and publishes a GitHub Release with the zipped add-in.
# Trigger: push a tag like v0.2.0 (or run manually with the tag to create).
# Release notes come from docs/release-notes/<tag>.md when that file exists.
# Versions below 1.0 and tags with a suffix (v1.0.0-beta.1) are marked as pre-releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create and release (for example v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        id: ver
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') { throw "Tag '$tag' must look like v1.2.3 or v1.2.3-beta.1" }
          $version = $Matches[1]
          $pre = [bool]$Matches[2] -or $version.StartsWith('0.')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag (version $version, pre-release: $pre)"

      - name: Test fitting library
        run: dotnet test tests/MeshFit.Core.Tests -c Release

      - name: Build SOLIDWORKS add-in
        run: dotnet build src/MeshFit.SolidWorks -c Release -p:Version=${{ steps.ver.outputs.version }}

      - name: Package
        shell: pwsh
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          $name = "MeshFit-SolidWorks-addin-$env:TAG"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item -Path src/MeshFit.SolidWorks/bin/Release/net48/* -Destination $name -Recurse
          Copy-Item -Path README.md -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          Get-ChildItem $name | Format-Table Name, Length

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          $notes = "docs/release-notes/$env:TAG.md"
          $ghArgs = @('release', 'create', $env:TAG, "MeshFit-SolidWorks-addin-$env:TAG.zip",
                      '--title', "MeshFit $env:TAG", '--target', $env:SHA)
          if (Test-Path $notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += '--generate-notes' }
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          gh @ghArgs
